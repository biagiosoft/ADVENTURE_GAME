<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>BSOFT Adventure Game</title>
  <link rel="stylesheet" href="css/game.css">
  <script src="js/game.js" defer></script>
</head>
<body>
<svg id="game" viewBox="0 0 1672 941" xmlns="http://www.w3.org/2000/svg" aria-label="Adventure Game">
  <defs>
    <filter id="shadow" x="-40%" y="-40%" width="190%" height="190%"><feDropShadow dx="5" dy="6" stdDeviation="3" flood-opacity=".8"/></filter>
    <filter id="green" x="-40%" y="-40%" width="190%" height="190%"><feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#32fa60" flood-opacity=".95"/></filter>
    <radialGradient id="glow"><stop stop-color="white" stop-opacity=".9"/><stop offset="1" stop-color="white" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1672" height="941" fill="#fff"/>
  <image id="scene" x="46" y="46" width="1580" height="849" preserveAspectRatio="xMidYMid meet"/>
  <g id="frame-mount"></g>
  <g id="menu-mount"></g>
  <g id="spark" pointer-events="none" opacity="0"><circle r="40" fill="url(#glow)"/><circle id="spark-ring" r="12" fill="none" stroke="#fff" stroke-width="3"/></g>
  <g id="notice" pointer-events="none" opacity="0"><rect x="285" y="782" width="1102" height="92" rx="4" fill="#111" stroke="#fff" stroke-width="4"/><text id="notice-text" x="836" y="835" text-anchor="middle" fill="#fff" font-family="Georgia,serif" font-size="27" font-style="italic"></text></g>
  <g id="panel" style="display:none">
    <rect x="450" y="233" width="772" height="462" rx="4" fill="#fff" stroke="#111" stroke-width="7"/>
    <text id="panel-title" x="836" y="304" font-size="40" text-anchor="middle" font-family="Georgia">Impostazioni</text>
    <g id="music-button" class="button" role="button" tabindex="0"><rect class="plate" x="590" y="355" width="490" height="85"/><text id="music-label" x="835" y="409" font-size="29" text-anchor="middle" font-family="Georgia">♫ Avvia musica</text></g>
    <text id="volume-title" x="836" y="510" font-size="27" text-anchor="middle" font-family="Georgia">Volume musica</text>
    <foreignObject id="volume-control" x="630" y="525" width="410" height="55"><input xmlns="http://www.w3.org/1999/xhtml" id="volume" aria-label="Volume musica" type="range" min="0" max="100" value="85" style="width:100%;height:45px;accent-color:#25bd42"/></foreignObject>
    <g id="close-button" class="button" role="button" tabindex="0"><rect class="plate" x="740" y="603" width="190" height="62"/><text x="835" y="646" font-size="26" text-anchor="middle" font-family="Georgia">Chiudi</text></g>
  </g>
</svg>
<div id="rotate">Ruota il dispositivo in orizzontale</div>
<audio id="ambient" src="assets/audio/musica.wav" preload="auto" loop></audio>
<audio id="lock" src="assets/audio/serratura.wav" preload="auto"></audio>
</body>
</html>
